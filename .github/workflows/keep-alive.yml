name: Keep Alive Actions Cron

on:
  schedule:
    - cron: "0 0 1 * *"  # Monthly on the 1st
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    name: Keep Central Watcher Active
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Keep Alive Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u > .keep-alive
          git add .keep-alive
          git commit -m "chore: keep alive central watcher cron [skip ci]" || exit 0
          git push
