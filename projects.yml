projects:
  - name: hello
    binary_names: "hello"

  - name: sed
    binary_names: "sed"
    # gnulib-tests requires linux/fs.h (kernel >=6.11) which musl-gcc can't find;
    # skip tests subdir so they don't block the main build
    make_args: "SUBDIRS=po ."

  - name: grep
    binary_names: "grep"
    configure_args: "--disable-perl-regexp"

  - name: gzip
    binary_names: "gzip gunzip zcat"

  - name: bc
    binary_names: "bc"

  - name: diffutils
    binary_names: "diff diff3 sdiff cmp"

  - name: findutils
    binary_names: "find xargs locate"
    configure_args: "--disable-assert"

  - name: gawk
    binary_names: "gawk"
    configure_args: "--disable-extensions --without-readline"

  - name: make
    binary_names: "make"

  - name: patch
    binary_names: "patch"

  - name: tar
    binary_names: "tar"

  - name: wget
    binary_names: "wget"
    configure_args: "--without-ssl --without-zlib"

  - name: less
    binary_names: "less lesskey"

  - name: bison
    binary_names: "bison"
