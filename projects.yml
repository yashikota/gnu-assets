projects:
  - name: hello
    binary_names: "hello"

  - name: sed
    binary_names: "sed"
    # gnulib-tests requires linux/fs.h (kernel >=6.11) which musl-gcc can't find;
    # skip tests subdir so they don't block the main build
    make_args: "SUBDIRS=po ."

  - name: grep
    binary_names: "grep"
    configure_args: "--disable-perl-regexp"

  - name: gzip
    binary_names: "gzip gunzip zcat"

  - name: bc
    binary_names: "bc"

  - name: diffutils
    binary_names: "diff diff3 sdiff cmp"

  - name: findutils
    binary_names: "find xargs locate"
    configure_args: "--disable-assert"

  - name: gawk
    binary_names: "gawk"
    configure_args: "--disable-extensions --without-readline"

  - name: make
    binary_names: "make"

  - name: patch
    binary_names: "patch"

  - name: tar
    binary_names: "tar"

  - name: wget
    binary_names: "wget"
    configure_args: "--without-ssl --without-zlib --disable-pcre --disable-pcre2 --disable-ntlm --without-libidn2 --without-libpsl --disable-iri"

  - name: wdiff
    binary_names: "wdiff"

  - name: m4
    binary_names: "m4"


  - name: time
    binary_names: "time"

  - name: datamash
    binary_names: "datamash"

  # recutils: libtool builds shared librec.la with -rpath even with
  # --disable-shared; the resulting binaries dynamically load musl's libc.so
  # which glibc's ldd rejects. Skip.
  # - name: recutils
  #   binary_names: "recsel recins recdel recset recfmt recfix reccount"

  - name: units
    binary_names: "units"

  - name: cpio
    binary_names: "cpio"

  - name: cppi
    binary_names: "cppi"

  - name: diction
    binary_names: "diction style"

  # complexity: requires libopts (autogen) not available on all platforms. Skip.
  # - name: complexity
  #   binary_names: "complexity"

  # sharutils: autogen-generated option-parsing code has duplicate program_name
  # symbols with --disable-nls; macOS libtool errors also. Skip.
  # - name: sharutils
  #   binary_names: "shar unshar uudecode uuencode"

  - name: spell
    binary_names: "spell"

  - name: teseq
    binary_names: "teseq"

  # gperf: gnulib lib/sys/types.h conflicts with musl's off64_t typedef. Skip.
  # - name: gperf
  #   binary_names: "gperf"

  - name: bool
    binary_names: "bool"

  # idutils: gnulib-generated stdio.h references gets() which musl removed. Skip.
  # - name: idutils
  #   binary_names: "mkid lid fid fnid xtokid aid eid gid"

  # barcode: multiple definition of 'streaming' (common-symbol bug in old code). Skip.
  # - name: barcode
  #   binary_names: "barcode"

  # cflow: macOS clang mishandles [[maybe_unused]] on function return types
  # in gnulib's bitrotate.h — deeply embedded in config generation. Skip.
  # - name: cflow
  #   binary_names: "cflow"

  - name: rush
    binary_names: "rush rushlast rushwho"

  # trueprint: macOS BSD ar incompatible with build system; Linux libtool
  # shared lib issue too. Skip.
  # - name: trueprint
  #   binary_names: "trueprint"

  - name: global
    binary_names: "global gtags gozilla htags"
    configure_args: "--disable-gtagscscope"

  - name: pem
    binary_names: "pem"

  - name: enscript
    binary_names: "enscript mkafmmap"

  - name: gcal
    binary_names: "gcal gcal2txt tcal txt2gcal"
    configure_args: "--disable-term"

