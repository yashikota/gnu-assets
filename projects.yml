projects:
  - name: hello
    binary_names: "hello"

  - name: sed
    binary_names: "sed"
    # gnulib-tests requires linux/fs.h (kernel >=6.11) which musl-gcc can't find;
    # skip tests subdir so they don't block the main build
    make_args: "SUBDIRS=po ."

  - name: grep
    binary_names: "grep"
    configure_args: "--disable-perl-regexp"

  - name: gzip
    binary_names: "gzip gunzip zcat"

  - name: bc
    binary_names: "bc"

  - name: diffutils
    binary_names: "diff diff3 sdiff cmp"

  - name: findutils
    binary_names: "find xargs locate"
    configure_args: "--disable-assert"

  - name: gawk
    binary_names: "gawk"
    configure_args: "--disable-extensions --without-readline"

  - name: make
    binary_names: "make"

  - name: patch
    binary_names: "patch"

  - name: tar
    binary_names: "tar"

  - name: wget
    binary_names: "wget"
    configure_args: "--without-ssl --without-zlib --disable-pcre --disable-pcre2 --disable-ntlm --without-libidn2 --without-libpsl --disable-iri"

  - name: wdiff
    binary_names: "wdiff"

  - name: m4
    binary_names: "m4"


  - name: time
    binary_names: "time"

  - name: datamash
    binary_names: "datamash"

  # recutils: libtool builds shared librec.la with -rpath even with
  # --disable-shared; the resulting binaries dynamically load musl's libc.so
  # which glibc's ldd rejects. Skip.
  # - name: recutils
  #   binary_names: "recsel recins recdel recset recfmt recfix reccount"

  - name: units
    binary_names: "units"

  - name: cpio
    binary_names: "cpio"

  - name: cppi
    binary_names: "cppi"

  - name: diction
    binary_names: "diction style"

  # complexity: requires libopts (autogen) not available on all platforms. Skip.
  # - name: complexity
  #   binary_names: "complexity"

  # sharutils: autogen-generated option-parsing code has duplicate program_name
  # symbols with --disable-nls; macOS libtool errors also. Skip.
  # - name: sharutils
  #   binary_names: "shar unshar uudecode uuencode"

  - name: spell
    binary_names: "spell"

  - name: teseq
    binary_names: "teseq"

  # gperf: gnulib lib/sys/types.h conflicts with musl's off64_t typedef. Skip.
  # - name: gperf
  #   binary_names: "gperf"

  - name: bool
    binary_names: "bool"

  # idutils: gnulib-generated stdio.h references gets() which musl removed. Skip.
  # - name: idutils
  #   binary_names: "mkid lid fid fnid xtokid aid eid gid"

  # barcode: multiple definition of 'streaming' (common-symbol bug in old code). Skip.
  # - name: barcode
  #   binary_names: "barcode"

  # cflow: macOS clang mishandles [[maybe_unused]] on function return types
  # in gnulib's bitrotate.h — deeply embedded in config generation. Skip.
  # - name: cflow
  #   binary_names: "cflow"

  - name: rush
    binary_names: "rush rushlast rushwho"

  # trueprint: macOS BSD ar incompatible with build system; Linux libtool
  # shared lib issue too. Skip.
  # - name: trueprint
  #   binary_names: "trueprint"

  # global: libtool shared plugins (user-custom.la, ctags.la) are mandatory;
  # cannot be built as fully static with musl. Skip.
  # - name: global
  #   binary_names: "global gtags gozilla htags"

  - name: pem
    binary_names: "pem"

  - name: enscript
    binary_names: "enscript mkafmmap"
    configure_args: "'CFLAGS=-O2 -Wno-implicit-function-declaration'"

  - name: gcal
    binary_names: "gcal gcal2txt tcal txt2gcal"
    configure_args: "--disable-term 'CFLAGS=-O2 -Wno-implicit-function-declaration'"

  # indent: unconditionally #include <libintl.h> even with --disable-nls;
  # macOS lacks system libintl and Homebrew's is outside allowed prefixes. Skip.
  # - name: indent
  #   binary_names: "indent"

  # which: macOS getopt.h:105 `extern int getopt()` conflicts with unistd.h
  # modern prototype — type error, not just a warning. Skip.
  # - name: which
  #   binary_names: "which"

  - name: ddrescue
    binary_names: "ddrescue ddrescuelog"

  - name: rcs
    binary_names: "rcs ci co rcsdiff rcsmerge rlog ident merge"
    configure_args: "'CFLAGS=-O2 -Wno-incompatible-function-pointer-types'"

  - name: mtools
    binary_names: "mtools"

  - name: jwhois
    binary_names: "jwhois"
    configure_args: "'CFLAGS=-O2 -Wno-implicit-function-declaration'"

  # marst: libtool shared lib with -rpath causes musl libc.so dynamic load. Skip.
  # - name: marst
  #   binary_names: "marst"

  - name: vc-dwim
    binary_names: "vc-dwim"

  # mcron: requires guile scripting engine. Skip.
  # - name: mcron
  #   binary_names: "mcron"

  # rottlog: configure script uses GNU sed extensions; BSD sed on macOS fails. Skip.
  # - name: rottlog
  #   binary_names: "rottlog"

  # direvent: uses clock_nanosleep/TIMER_ABSTIME which are Linux-only. Skip.
  # - name: direvent
  #   binary_names: "direvent"

  - name: pexec
    binary_names: "pexec"

  - name: cssc
    binary_names: "admin cdc delta get prs prt rmdel sact sccs unget val what"

  - name: help2man
    binary_names: "help2man"

  - name: stow
    binary_names: "stow"

  - name: shtool
    binary_names: "shtool"

  # gengetopt: C++ program; musl-gcc has no static libstdc++. Skip.
  # - name: gengetopt
  #   binary_names: "gengetopt"

  # httptunnel: no GPG signature file on FTP server. Skip.
  # - name: httptunnel
  #   binary_names: "htc hts"

  # alive: requires guile scripting engine. Skip.
  # - name: alive
  #   binary_names: "alive"

  # macchanger: requires linux/ethtool.h (Linux-only); asm/types.h missing with
  # musl-gcc minimal asm/ stub. Skip.
  # - name: macchanger
  #   binary_names: "macchanger"

  # gsasl: libtool shared lib with -rpath causes musl libc.so dynamic load. Skip.
  # - name: gsasl
  #   binary_names: "gsasl"

  # plotutils: libtool shared lib with -rpath. Skip.
  # - name: plotutils
  #   binary_names: "graph plot spline ode"

  # moe: libtool shared lib with -rpath. Skip.
  # - name: moe
  #   binary_names: "moe"

  # gtypist: requires ncursesw; musl-gcc cannot find system ncurses headers. Skip.
  # - name: gtypist
  #   binary_names: "gtypist"

  # anubis: requires libgpg-error external dependency. Skip.
  # - name: anubis
  #   binary_names: "anubis"

  # gnu-pw-mgr: libtool shared lib with -rpath causes musl libc.so dynamic load. Skip.
  # - name: gnu-pw-mgr
  #   binary_names: "gnu-pw-mgr"

  # serveez: --without-guile is unrecognized; guile is required. Skip.
  # - name: serveez
  #   binary_names: "serveez"

  # ccd2cue: #include <error.h> is glibc-specific; not available with musl. Skip.
  # - name: ccd2cue
  #   binary_names: "ccd2cue"

  # avl: GPG signature verification fails for avl-2.0.3.tar.gz. Skip.
  # - name: avl
  #   binary_names: "avltest"

  - name: ed
    binary_names: "ed"

  # combine: make install fails on guile scripting data install step. Skip.
  # - name: combine
  #   binary_names: "combine"

  # less: requires ncurses built with musl; two-stage build not supported. Skip.
  # - name: less
  #   binary_names: "less lesskey"

  # nano: requires ncurses; same musl/ncurses static link issue. Skip.
  # - name: nano
  #   binary_names: "nano"

  # screen: requires ncurses on Linux; links libpam on macOS (not in allowed list). Skip.
  # - name: screen
  #   binary_names: "screen"

  # inetutils: rcp not installed by 2.8; ftp links libedit on macOS. Skip.
  # - name: inetutils
  #   binary_names: "ftp hostname ifconfig logger ping rcp rexec rlogin rsh talk telnet tftp traceroute uname whois"

  # gdbm: libtool shared lib with -rpath causes musl libc.so dynamic load. Skip.
  # - name: gdbm
  #   binary_names: "gdbm_dump gdbm_load gdbmtool"

  - name: unrtf
    binary_names: "unrtf"

  # ocrad: C++ program; not fully static with musl-gcc (no static libstdc++). Skip.
  # - name: ocrad
  #   binary_names: "ocrad"

  # a2ps: requires bdw-gc (Boehm GC) external dependency. Skip.
  # - name: a2ps
  #   binary_names: "a2ps fixps pdiff psmandup psnup psset card composeglyphs fixnt ogonkify"

  - name: userv
    binary_names: "userv uservd"

  # swbis: requires libz.a (static zlib); config.sub too old for macOS. Skip.
  # - name: swbis
  #   binary_names: "swinstall swremove swverify swlist swign swpackage"

  # mifluz: requires libdb (Berkeley DB); macOS dbenv compile error. Skip.
  # - name: mifluz
  #   binary_names: "inverted"

  # aspell: C++ program; not fully static with musl-gcc. Skip.
  # - name: aspell
  #   binary_names: "aspell"

  # lightning: library only, no CLI binary installed. Skip.
  # - name: lightning
  #   binary_names: "lightning"

  # gnushogi: ld linker error building static binary. Skip.
  # - name: gnushogi
  #   binary_names: "gnushogi"

  # gnugo: ld linker error building mkmcpat static binary. Skip.
  # - name: gnugo
  #   binary_names: "gnugo"

  # motti: C++ program; not fully static with musl-gcc. Skip.
  # - name: motti
  #   binary_names: "motti"

  # gama: binary names are gama-local/gama-g3, not gama; also C++ program. Skip.
  # - name: gama
  #   binary_names: "gama"

  # pies: Linux daemon; uses asm/posix_types.h (musl stub incomplete);
  # macOS lacks CBAUD/SIGPWR. Skip.
  # - name: pies
  #   binary_names: "pies"

  - name: bison
    binary_names: "bison yacc"

  - name: bash
    binary_names: "bash"

  - name: texinfo
    binary_names: "install-info texindex"

  # groff: gnulib lib/sys/types.h off64_t conflicts with musl's typedef. Skip.
  # - name: groff
  #   binary_names: "groff grog troff nroff pic tbl eqn refer soelim preconv grops gropdf grotty grn grodvi"

  # dap: libtool shared lib on Linux; uses finite() (non-standard) on macOS. Skip.
  # - name: dap
  #   binary_names: "dap"

  # xorriso: requires many kernel headers (asm/byteorder.h etc.); macOS links libbz2/libedit. Skip.
  # - name: xorriso
  #   binary_names: "xorriso xorrisofs xorrecord"

  # nettle: libtool shared lib; macOS links own libnettle.dylib. Skip.
  # - name: nettle
  #   binary_names: "nettle-hash nettle-pbkdf2 nettle-lfib-stream sexp-conv"

  - name: gengen
    binary_names: "gengen"

  - name: coreutils
    binary_names: "ls cp mv mkdir rmdir cat head tail tee wc sort uniq cut paste join tr od touch chmod chown ln stat du df date id echo printf env pwd tty true false sleep comm shred split shuf truncate timeout nice"

  # gettext: gnulib off64_t conflict with musl; macOS undefined symbols. Skip.
  # - name: gettext
  #   binary_names: "msgfmt msgmerge msginit msgcat msgconv xgettext msgattrib msgcomm msgcmp msgen msgexec msgfilter msggrep msginit msgunfmt msguniq envsubst"

  # gnuchess: C++ program with readline; not fully static with musl-gcc. Skip.
  # - name: gnuchess
  #   binary_names: "gnuchess"
  #   ftp_path: "chess"
  #   tarball_prefix: "gnuchess"

  # radius: uses u_char (BSD type) unavailable with musl. Skip.
  # - name: radius
  #   binary_names: "radiusd radtest radlast radwho radzap"

  # poke: requires Boehm GC external dependency. Skip.
  # - name: poke
  #   binary_names: "poke"

  # vcdimager: requires libcdio external dependency. Skip.
  # - name: vcdimager
  #   binary_names: "vcdimager vcddebug vcd-info"

  # vera: data-only package (dictionary text + Perl script); no C binary. Skip.
  # - name: vera
  #   binary_names: "vera"

  # glpk: libtool shared libglpk with -rpath causes musl libc.so dynamic load; macOS links own dylib. Skip.
  # - name: glpk
  #   binary_names: "glpsol"

  # gnubatch: requires curses/ncurses; musl-gcc cannot find system ncurses headers. Skip.
  # - name: gnubatch
  #   binary_names: "btq btr bta btd btedit btrw btwrite xbq"

  # gnats: broken build system (ds-file/libds-file.a missing rule on macOS);
  # also has -Werror on old code with pointer/fallthrough warnings. Skip.
  # - name: gnats
  #   binary_names: "send-pr query-pr file-pr edit-pr gnats-admin"

  # adns: client binaries link against libadns.so (shared); can't find static libadns. Skip.
  # - name: adns
  #   binary_names: "adnshost adnslogres adnsresfilter"

  # gss: gnulib-generated stdint.h has #if with no expression (syntax error on musl/macOS). Skip.
  # - name: gss
  #   binary_names: "gss"

  # libtasn1: libtool shared lib with -rpath causes musl libc.so dynamic load.
  # --disable-shared and -all-static both fail to produce fully static binary. Skip.
  # - name: libtasn1
  #   binary_names: "asn1Coding asn1Decoding asn1Parser"

  # libidn: same libtool shared lib issue. Skip.
  # - name: libidn
  #   binary_names: "idn"

  - name: ncurses
    binary_names: "tic infocmp toe tput tset captoinfo infotocap"
    configure_args: "--without-shared --with-normal"

  # gnucobol: requires GMP and Berkeley DB external dependencies. Skip.
  # - name: gnucobol
  #   binary_names: "cobc cobcrun"

  # mcsim: libtool shared lib with -rpath; also requires -llapack external dep. Skip.
  # - name: mcsim
  #   binary_names: "mcsim"

  # hp2xx: requires X11/Xlib.h on Linux (X11 dep); old getopt.c missing string.h on macOS. Skip.
  # - name: hp2xx
  #   binary_names: "hp2xx"

  # superopt: requires explicit CPU target flag (-DSPARC etc.); very old code. Skip.
  # - name: superopt
  #   binary_names: "superopt"

  # proxyknife: broken old code (implicit function decls, pod2man failures). Skip.
  # - name: proxyknife
  #   binary_names: "proxyknife"

  - name: speedx
    binary_names: "speedx"

  - name: vc-changelog
    binary_names: "vc-changelog"
    ftp_path: "vc-changelog"

  # termutils: very old K&R C syntax errors on modern compilers. Skip.
  # - name: termutils
  #   binary_names: "ul"

  # ferret: no configure script; bare Makefile that fails with musl-gcc. Skip.
  # - name: ferret
  #   binary_names: "ferret"

  # c-graph: requires Fortran compiler. Skip.
  # - name: c-graph
  #   binary_names: "c-graph"

  # uucp: very old configure (1994-era) fails on macOS with "C compiler cannot create executables". Skip.
  # - name: uucp
  #   binary_names: "uucico uuxqt uucp uux uustat cu"

  # sauce: requires Tcl (tclsh) to build. Skip.
  # - name: sauce
  #   binary_names: "sauce"

  - name: mailutils
    binary_names: "mail dotlock mailq"
    configure_args: "--without-guile --disable-python --without-gsasl --without-gnutls --without-ldap --without-berkeley-db"

  - name: gnucap
    binary_names: "gnucap"
    configure_args: "--without-readline"

  # acct: libtool shared lib with -rpath causes musl libc.so dynamic load. Skip.
  # - name: acct
  #   binary_names: "accton ac lastcomm dump-acct dump-utmp"

